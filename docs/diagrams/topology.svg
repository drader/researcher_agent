<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="title desc">
  <title id="title">researcher_agent — high-level topology</title>
  <desc id="desc">User invokes Claude Code which dispatches to three discovery surfaces: slash commands, skills, and sub-agents. Each surface references a shared infrastructure layer of references, templates, and examples.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14142a"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="560" fill="#0a0a14"/>

  <!-- subtle grid -->
  <g stroke="#1e1b4b" stroke-width="0.5" opacity="0.18">
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="0" y1="420" x2="900" y2="420"/>
  </g>

  <!-- USER box -->
  <g>
    <rect x="370" y="40" width="160" height="64" rx="6" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="450" y="70" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="2">USER</text>
    <text x="450" y="90" text-anchor="middle" fill="#6b6f96" font-size="11">Claude Code</text>
  </g>

  <!-- "invokes" label -->
  <text x="555" y="130" fill="#6b6f96" font-size="10" letter-spacing="2">INVOKES</text>

  <!-- arrows: USER → 3 surfaces -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 450 108 L 160 200"/>
    <path d="M 450 108 L 450 200"/>
    <path d="M 450 108 L 740 200"/>
  </g>

  <!-- 3 discovery surfaces -->
  <g>
    <!-- slash commands -->
    <rect x="60" y="206" width="200" height="92" rx="6" fill="url(#boxGrad)" stroke="#1e1b4b" stroke-width="1.5"/>
    <rect x="60" y="206" width="3" height="92" fill="#818cf8"/>
    <text x="160" y="230" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="700">slash commands</text>
    <text x="160" y="252" text-anchor="middle" fill="#cdd0e8" font-size="11">.claude/commands/</text>
    <text x="160" y="278" text-anchor="middle" fill="#6b6f96" font-size="10">24 files · *.md</text>

    <!-- skills -->
    <rect x="350" y="206" width="200" height="92" rx="6" fill="url(#boxGrad)" stroke="#1e1b4b" stroke-width="1.5"/>
    <rect x="350" y="206" width="3" height="92" fill="#818cf8"/>
    <text x="450" y="230" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="700">skills</text>
    <text x="450" y="252" text-anchor="middle" fill="#cdd0e8" font-size="11">.claude/skills/&lt;name&gt;/</text>
    <text x="450" y="278" text-anchor="middle" fill="#6b6f96" font-size="10">4 skills · 24 modes</text>

    <!-- sub-agents -->
    <rect x="640" y="206" width="200" height="92" rx="6" fill="url(#boxGrad)" stroke="#1e1b4b" stroke-width="1.5"/>
    <rect x="640" y="206" width="3" height="92" fill="#818cf8"/>
    <text x="740" y="230" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="700">sub-agents</text>
    <text x="740" y="252" text-anchor="middle" fill="#cdd0e8" font-size="11">.claude/agents/</text>
    <text x="740" y="278" text-anchor="middle" fill="#6b6f96" font-size="10">21 personas</text>
  </g>

  <!-- "references" label -->
  <text x="555" y="338" fill="#6b6f96" font-size="10" letter-spacing="2">EACH ENTRY REFERENCES</text>

  <!-- arrows: 3 surfaces → shared infra -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 160 302 L 450 410"/>
    <path d="M 450 302 L 450 410"/>
    <path d="M 740 302 L 450 410"/>
  </g>

  <!-- SHARED INFRA box -->
  <g>
    <rect x="280" y="416" width="340" height="92" rx="6" fill="url(#boxGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)" opacity="0.95"/>
    <rect x="280" y="416" width="3" height="92" fill="#34d399"/>
    <text x="450" y="440" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700" letter-spacing="1">SHARED INFRASTRUCTURE</text>
    <text x="450" y="465" text-anchor="middle" fill="#cdd0e8" font-size="12">references/  ·  templates/  ·  examples/</text>
    <text x="450" y="488" text-anchor="middle" fill="#6b6f96" font-size="10">methodology docs · output structures · worked examples</text>
  </g>

  <!-- footer hint -->
  <text x="450" y="538" text-anchor="middle" fill="#6b6f96" font-size="10" letter-spacing="2">DISCOVERED BY CLAUDE CODE · PROJECT-LOCAL OR USER-LEVEL</text>
</svg>
