<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-labelledby="title desc">
  <title id="title">orchestrate-pipeline — 10 stages, 6 mandatory gates</title>
  <desc id="desc">End-to-end research-to-manuscript pipeline. Ten stages from scope through disclosure. Six mandatory human-approval gates fire after stages 1, 3, 4, 6, 8, and 9. Every stage writes to pipeline-logbook.json for resume. Canonical definition lives in skills/orchestrate/SKILL.md sections 3 and 4.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14142a"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="480" fill="#0a0a14"/>

  <!-- header -->
  <text x="40" y="36" fill="#6b6f96" font-size="10" letter-spacing="3">PIPELINE FLOW · CANONICAL</text>
  <text x="40" y="58" fill="#818cf8" font-size="17" font-weight="700">orchestrate-pipeline · 10 stages, 6 mandatory gates</text>
  <text x="40" y="76" fill="#6b6f96" font-size="10">source of truth: skills/orchestrate/SKILL.md §3–4</text>

  <!-- legend -->
  <g transform="translate(800,30)">
    <rect width="260" height="60" rx="4" fill="#0f0f1e" stroke="#1e1b4b"/>
    <rect x="14" y="14" width="14" height="14" rx="2" fill="url(#bg)" stroke="#818cf8"/>
    <text x="36" y="25" fill="#cdd0e8" font-size="11">stage</text>
    <text x="100" y="25" fill="#fbbf24" font-size="14" font-weight="700">◆</text>
    <text x="116" y="25" fill="#cdd0e8" font-size="11">mandatory gate</text>
    <text x="14" y="50" fill="#34d399" font-size="10">gates after: 1, 3, 4, 6, 8, 9</text>
  </g>

  <!-- ROW 1: stages 1-5 -->
  <g transform="translate(40,110)">
    <!-- 01 scope (gate 1 after) -->
    <g>
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">01</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G1</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">scope</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">research · socratic</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ scope locked</text>
    </g>
    <path d="M 198 45 L 218 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 02 lit-search (no gate) -->
    <g transform="translate(218,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">02</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">lit-search</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">research · full / brief</text>
      <text x="14" y="80" fill="#6b6f96" font-size="9">verified source list</text>
    </g>
    <path d="M 416 45 L 436 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 03 synthesis (gate 2 after) -->
    <g transform="translate(436,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">03</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G2</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">synthesis</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">research · systematic</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ evidence base</text>
    </g>
    <path d="M 634 45 L 654 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 04 outline (gate 3 after) -->
    <g transform="translate(654,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">04</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G3</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">outline</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · outline</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ structure committed</text>
    </g>
    <path d="M 852 45 L 872 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 05 draft (no gate) -->
    <g transform="translate(872,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">05</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">draft</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · full</text>
      <text x="14" y="80" fill="#6b6f96" font-size="9">manuscript draft</text>
    </g>
  </g>

  <!-- wrap arrow: from end of row 1 down to start of row 2 -->
  <g stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <path d="M 1067 155 L 1085 155 L 1085 270 L 22 270 L 22 295" marker-end="url(#arrW)"/>
  </g>

  <!-- ROW 2: stages 6-10 -->
  <g transform="translate(40,290)">
    <!-- 06 self-critique (gate 4 after) -->
    <g>
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">06</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G4</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">self-critique</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">critique · full</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ roadmap accepted</text>
    </g>
    <path d="M 198 45 L 218 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 07 revise (no gate) -->
    <g transform="translate(218,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">07</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">revise</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · revision</text>
      <text x="14" y="80" fill="#6b6f96" font-size="9">max 2 loops</text>
    </g>
    <path d="M 416 45 L 436 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 08 citation-audit (gate 5 after) -->
    <g transform="translate(436,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">08</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G5</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">citation-audit</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · citation-check</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ citations clean</text>
    </g>
    <path d="M 634 45 L 654 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 09 finalize-format (gate 6 after) -->
    <g transform="translate(654,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="195" y="0" width="3" height="90" fill="#fbbf24"/>
      <text x="14" y="20" fill="#818cf8" font-size="10" letter-spacing="1">09</text>
      <text x="173" y="20" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">◆ G6</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">finalize-format</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · format</text>
      <text x="14" y="80" fill="#fbbf24" font-size="9">→ final accepted</text>
    </g>
    <path d="M 852 45 L 872 45" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <!-- 10 disclosure (no gate) -->
    <g transform="translate(872,0)">
      <rect width="195" height="90" rx="6" fill="url(#bg)" stroke="#34d399" stroke-width="1.5"/>
      <text x="14" y="20" fill="#34d399" font-size="10" letter-spacing="1">10</text>
      <text x="14" y="44" fill="#cdd0e8" font-size="14" font-weight="700">disclosure</text>
      <text x="14" y="64" fill="#6b6f96" font-size="10">compose · disclosure</text>
      <text x="14" y="80" fill="#34d399" font-size="9">venue-specific AI stmt</text>
    </g>
  </g>

  <!-- pipeline-logbook footer band -->
  <g transform="translate(40,420)">
    <rect width="1020" height="34" rx="4" fill="#0f0f1e" stroke="#34d399" stroke-width="1" opacity="0.95"/>
    <text x="20" y="22" fill="#34d399" font-size="11" font-weight="700" letter-spacing="2">pipeline-logbook.json</text>
    <text x="220" y="22" fill="#6b6f96" font-size="11">every stage writes here  ·  /orchestrate-resume reads from here  ·  prior gate approvals honored</text>
  </g>
</svg>
